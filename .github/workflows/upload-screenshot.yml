name: Upload Screenshot

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: screenshot-upload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-s3-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    #storing in GitHub secrets and variables for now
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Compile project
        run: mvn -B clean compile test-compile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers (with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: >
          mvn -B org.codehaus.mojo:exec-maven-plugin:3.1.0:java
          -Dexec.mainClass="com.microsoft.playwright.CLI"
          -Dexec.classpathScope="test"
          -Dexec.args="install --with-deps chromium"

          - name: Install Playwright browsers (cache hit, skip OS deps)
            if: steps.playwright-cache.outputs.cache-hit == 'true'
            run: >
              mvn -B org.codehaus.mojo:exec-maven-plugin:3.1.0:java
              -Dexec.mainClass="com.microsoft.playwright.CLI"
              -Dexec.classpathScope="test"
              -Dexec.args="install chromium"

      - name: Run tests
        run: mvn -B test

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-reports/

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: target/screenshots/

      - name: Upload log file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: target/logs/